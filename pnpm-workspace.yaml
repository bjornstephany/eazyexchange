overrides:
  # next 15.5.21 still declares sharp ^0.34.3, but sharp <0.35.0 carries four
  # high libvips CVEs (GHSA-f88m-g3jw-g9cj) that fail the dependency-audit gate.
  # We don't import sharp ourselves and Vercel optimizes images on the platform,
  # so forcing the patched line is safe. Drop this once next ships sharp ^0.35.
  sharp: ^0.35.3

allowBuilds:
  # sharp = next 15's image optimizer; its install step fetches prebuilt binaries.
  '@parcel/watcher': true
  '@swc/core': true
  sharp: true
  unrs-resolver: true
