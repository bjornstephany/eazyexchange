overrides:
  # next 15.5.21 still declares sharp ^0.34.3, but sharp <0.35.0 carries four
  # high libvips CVEs (GHSA-f88m-g3jw-g9cj) that fail the dependency-audit gate.
  # We don't import sharp ourselves and Vercel optimizes images on the platform,
  # so forcing the patched line is safe. Drop this once next ships sharp ^0.35.
  sharp: ^0.35.3

  # next hard-pins an old postcss, and the sourceMappingURL arbitrary-.map-read
  # advisory has now been re-cut three times, each superseding the last:
  # GHSA-6g55-p6wh-862q (<=8.5.11) -> GHSA-r28c-9q8g-f849 (<=8.5.17) ->
  # GHSA-fxqj-rqcc-2cmp (<=8.5.22, incomplete fix of the first). Every round the
  # floor has to be RAISED and the lockfile re-resolved — an override range does
  # not protect against a new advisory published above its floor.
  # 8.x -> 8.5.x is a same-major bump of a semver-stable package used by both
  # next and tailwind. Drop this once next pins postcss >=8.5.23.
  postcss: ^8.5.23

allowBuilds:
  # sharp = next 15's image optimizer; its install step fetches prebuilt binaries.
  '@parcel/watcher': true
  '@swc/core': true
  sharp: true
  unrs-resolver: true
